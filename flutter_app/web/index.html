<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <!-- Replaced by `flutter build web --base-href /fin-app/` in the Pages workflow. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Only this site, Supabase and Flutter's own CDN (canvaskit, fonts) may load or be contacted. -->
  <!-- frame-ancestors cannot be set from a meta tag; it needs a real response header (see README). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.gstatic.com; font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.gstatic.com https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">

  <!-- Flutter replaces this tag at start-up; it never asks for "cover", so the page stays out of the
       notch and home-indicator areas. Keep it that way: Flutter web doesn't pad for them. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ciclos, movimentos e previsão das tuas finanças.">
  <meta name="theme-color" content="#0B0B0C">

  <!-- iOS: installs from Safari → Share → Add to Home Screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Opaque, not translucent: with a translucent status bar the home-screen app is drawn under it
       while iOS measures the page without it, which misplaces touches near the bottom bar. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Painel">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <title>Painel Financeiro</title>
  <link rel="manifest" href="manifest.json">
  <style>html, body { margin: 0; background: #0B0B0C; }</style>
</head>
<body>
  <script src="ios_viewport_fix.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
